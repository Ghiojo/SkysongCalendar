# JitPack builds the plugin from a git tag so other plugins can compile against its API:
#   repositories { maven { url 'https://jitpack.io' } }
#   dependencies { compileOnly 'com.github.Ghiojo:SkysongCalendar:<tag>' }
jdk:
  - openjdk21
install:
  - ./gradlew build publishToMavenLocal --no-daemon
