name: SkysongCalendar
version: '1.0'
main: org.skysongdev.skysongCalendar.SkysongCalendar
api-version: '1.21'
softdepend: [Skysong_Items, PlaceholderAPI]
commands:
  calendar:
    description: "Reloads SkysongCalendar's config"
    usage: "/calendar reload"
  date:
    description: "Shows the IC date and time"
    usage: "/date"
permissions:
  skysongcalendar.reload:
    description: "Use /calendar reload"
    default: op
