time:
  # Drive the Minecraft time of every managed world from the IC calendar.
  enabled: true
  # How often world time is set, in server ticks (20 ticks = 1 second).
  # The sun moves less than one Minecraft tick per second, so the steps are invisible.
  update-interval-ticks: 20
  # Worlds whose time this plugin never touches: no gamerule change, no time set.
  # The Nether and the End have no day cycle and are always skipped.
  blacklisted-worlds: []
  # IC hours of daylight, changing smoothly through the year. Noon is always the same.
  # Set both hours to 12 for even days and nights all year.
  daylight:
    min-hours: 10   # on the winter solstice
    max-hours: 14   # on the summer solstice
    # The longest day, as "<month> <day>". The shortest day is half a year (180 days) later,
    # so the default puts the winter solstice on Litoria 1.
    summer-solstice: Ramphastos 1
