plugins {
    id 'java'
    id 'maven-publish'
}

group = 'org.skysongdev'
version = '1.1.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/releases/"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT"
    // SkysongItems' API, for the calendar item tag. SkysongItems ships it, so it is never shaded.
    compileOnly 'com.github.Ghiojo:Skysong-Special-Items:1.2.0'
    // PlaceholderAPI, for the %skysongcalendar_...% placeholders. Optional at runtime.
    compileOnly 'me.clip:placeholderapi:2.11.6'

    testImplementation "io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    // JitPack builds the javadoc jar, so a missing @param or similar must not fail a release.
    options.addBooleanOption('Xdoclint:none', true)
}

// Other plugins compile against this jar, through JitPack, as
// compileOnly 'com.github.Ghiojo:SkysongCalendar:<tag>' (see jitpack.yml).
// Only the org.skysongdev.skysongCalendar.api package is supported for them.
publishing {
    publications {
        maven(MavenPublication) {
            artifactId = rootProject.name
            from components.java
            // JitPack doesn't pass the group and tag to a custom install command, so they
            // are read from the environment variables it sets for every build.
            if (System.getenv('JITPACK')) {
                groupId = System.getenv('GROUP')
                version = System.getenv('VERSION')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
